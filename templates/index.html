<!DOCTYPE html>
<html>
<head>
    <title>Syria Wheat Yield Predictor</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 550px; margin: 50px auto; padding: 20px; background: #f7f7f7; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; font-size: 1.4rem; }
        label { display: block; margin-top: 15px; font-weight: 500; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        .result { margin-top: 20px; padding: 15px; background: #ecfdf5; border-left: 4px solid #10b981; border-radius: 6px; }
        .api-note { margin-top: 25px; font-size: 0.85rem; color: #666; }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Syria Wheat Yield Predictor</h1>
    <p style="color:#666;font-size:0.95rem;">Predict wheat yield (kg/ha) from growing-season climate conditions.</p>

    <form method="post" action="/predict">
        <label>Growing Season Rainfall (mm)</label>
        <input type="number" step="0.1" name="rainfall" value="{{ rainfall or 250 }}" required>

        <label>Growing Season Solar (kWh/m²/day)</label>
        <input type="number" step="0.01" name="solar" value="{{ solar or 4.2 }}" required>

        <button type="submit">Predict Yield</button>
    </form>

    {% if prediction %}
    <div class="result">
        <strong>Predicted Yield:</strong> {{ prediction }}
    </div>
    {% endif %}

    <div class="api-note">
        API: <code>POST /api/predict?rainfall=250&solar=4.2</code>
    </div>
</div>
</body>
</html>
